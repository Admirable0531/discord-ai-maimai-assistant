name: Deploy to OptiPlex

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Runs directly on the host itself via a self-hosted runner registered
    # to this repo specifically (see maimaiscrape's deploy.yml for the same
    # pattern and the reasoning: a self-hosted runner polls outward to
    # GitHub, so nothing needs to be reachable from the internet). Migrated
    # off the Pi (192.168.0.25) to an OptiPlex (192.168.0.225) on
    # 2026-08-09 — flat ~/ layout there instead of ~/Desktop/.
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd /home/ryan/discord-ai-maimai-assistant
          git pull
          docker compose down
          docker compose up -d --build
